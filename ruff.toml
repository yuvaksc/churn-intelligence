# ruff.toml — CI lint gate.
# Deliberately scoped to critical correctness rules (syntax errors, undefined
# names, invalid literals/format) so the gate is meaningful and green on the
# existing codebase. Broaden `select` later to add style enforcement.

target-version = "py312"
extend-exclude = [".claude", "data", "models", "frontend"]

[lint]
select = ["E9", "F63", "F7", "F82"]
