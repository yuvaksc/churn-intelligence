[pytest]
# Package roots on the import path, so tests import churn_data, churn_ml, churn_rag,
# churn_agents, churn_evals, api and mcp_server without an install step.
pythonpath =
    packages/data
    packages/ml
    packages/rag
    packages/agents
    packages/evals
    services/api
    services/mcp
    tests
testpaths = tests
addopts = -q
