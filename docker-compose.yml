# docker-compose.yml — the full stack locally, with production parity:
#
#   db          Postgres 16 + pgvector. On first start it applies supabase/migrations/*.sql,
#               the same migrations `supabase db push` applies to production.
#   mcp-server  FastMCP tools (policy, competitor intel, CRM) over SSE — one long-lived
#               server reused by every analysis.
#   api         FastAPI + LangGraph war room.
#   frontend    Next.js.
#
# First run:
#   docker compose up -d --build
#   docker compose exec api python -m churn_ml.retrain --promote force   # train + register champion
#   docker compose exec api python -m churn_ml.scoring --seed           # customers + scores + CRM
#   docker compose exec api python -m churn_rag.pg_index                # RAG documents
#   open http://localhost:3000
#
# Inside the Docker network services reach each other by name (db:5432, mcp-server:8001);
# from your machine use localhost (Postgres is published on 5433 to avoid clashing with
# a local Postgres).

services:

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: churn
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d churn"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mcp-server:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    ports:
      - "8001:8001"
    environment:
      MCP_TRANSPORT: sse
      MCP_PORT: "8001"
      MCP_HOST: "0.0.0.0"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/churn
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/churn
      MCP_TRANSPORT: sse
      MCP_SERVER_URL: http://mcp-server:8001/sse
      WARM_MODELS: "1"
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-churn}
      ANALYSIS_LIMIT_PER_HOUR: ${ANALYSIS_LIMIT_PER_HOUR:-0}     # unlimited locally
      MODEL_BUNDLE_PATH: models/champion.joblib
    volumes:
      # Trained models + MLflow runs persist on the host and are shared with your shell.
      - ./models:/app/models
      - ./mlruns:/app/mlruns
      - ./data/raw:/app/data/raw:ro      # dataset for retrain / seed / RAG indexing
    depends_on:
      db:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # Embedded at build time; must be reachable from YOUR BROWSER, not from Docker.
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
