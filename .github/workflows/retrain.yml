name: Retrain model

# Scheduled (weekly) or manual: train → register challenger in MLflow → compare with
# the @champion on held-out data → promote only if it wins → re-score customers.
on:
  schedule:
    - cron: "0 6 * * 1"          # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      promote:
        description: "auto = promote only if the challenger wins"
        type: choice
        options: [auto, never, force]
        default: auto
      n_iter:
        description: "random-search candidates (5-fold CV each)"
        default: "25"

permissions:
  contents: read

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: packages/data:packages/ml:packages/rag:packages/agents:packages/evals
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}   # remote server; falls back to local SQLite
      DATABASE_URL: ${{ secrets.DATABASE_URL }}                 # optional: re-score customers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train, compare, promote
        run: python -m churn_ml.retrain --n-iter "${{ inputs.n_iter || '25' }}" --promote "${{ inputs.promote || 'auto' }}"
      - name: Re-score customers with the champion (scores + SHAP drivers)
        if: env.DATABASE_URL != ''
        run: python -m churn_ml.scoring
      - name: Report
        run: |
          echo '## Retrain report' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat models/reports/retrain_report.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: retrain-${{ github.run_id }}
          path: |
            models/reports/
            models/champion.joblib
            models/champion.json
